services:
  readeck:
    image: codeberg.org/readeck/readeck:0.23.2

    ports:
      - "127.0.0.1:14020:8000"

    environment:
      READECK_LOG_LEVEL: info
      READECK_LOG_FORMAT: text
      READECK_SERVER_HOST: "0.0.0.0"
      READECK_SERVER_PORT: "8000"

    volumes:
      - ${HOME}/personal-cloud-data/readeck:/readeck

    init: true
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - /bin/readeck
        - healthcheck
        - -config
        - /readeck/config.toml
      interval: 30s
      timeout: 5s
      retries: 5
