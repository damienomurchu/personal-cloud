name: ntfy

services:
  ntfy:
    image: binwiederhier/ntfy:v2.26.3
    container_name: ntfy
    command: serve

    restart: unless-stopped
    init: true

    environment:
      TZ: Europe/Dublin

      # Public URL used when generating links and attachment URLs.
      NTFY_BASE_URL: https://ntfy.damienmurphy.net

      # Cloudflare Tunnel acts as the reverse proxy.
      NTFY_BEHIND_PROXY: "true"

      # Persistent SQLite databases.
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db

      # Private by default: anonymous users cannot publish or subscribe.
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"

      # Persistent attachment storage.
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT: 1G
      NTFY_ATTACHMENT_FILE_SIZE_LIMIT: 15M
      NTFY_ATTACHMENT_EXPIRY_DURATION: 24h

      # Required for reliable instant notifications through the iOS app.
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh

      # Avoid retaining notifications indefinitely.
      NTFY_CACHE_DURATION: 7d

    volumes:
      - /Users/me/personal-cloud-data/ntfy:/var/lib/ntfy

    ports:
      # Accessible only from the Mac mini itself.
      # Cloudflare Tunnel should connect to localhost:8093.
      - "127.0.0.1:8093:80"

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q --tries=1 http://localhost:80/v1/health -O -
          | grep -Eo '"healthy"\s*:\s*true'
          || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"