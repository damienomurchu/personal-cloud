services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_MODS=linuxserver/mods:universal-calibre

    volumes:
      - ./config:/config
      - /Users/me/.calibre:/books

    ports:
      - "127.0.0.1:${CALIBRE_WEB_PORT}:8083"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
